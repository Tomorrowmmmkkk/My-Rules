name: Update All Rules

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: update-all-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build CN IPv4 source and merged lists
        shell: bash
        run: |
          python3 - <<'PY'
          import ipaddress
          import urllib.request
          from pathlib import Path

          sources = (
              "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo-lite/geoip/cn.list",
              "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geoip/cn.list",
          )

          def load_ipv4(url):
              request = urllib.request.Request(url, headers={"User-Agent": "My-Rules updater"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  text = response.read().decode("utf-8-sig")

              networks = set()
              for raw_line in text.splitlines():
                  value = raw_line.split("#", 1)[0].strip()
                  if not value:
                      continue
                  network = ipaddress.ip_network(value, strict=False)
                  if network.version == 4:
                      networks.add(network)
              return networks

          lite = load_ipv4(sources[0])
          full = load_ipv4(sources[1])

          only = sorted(lite, key=lambda network: (int(network.network_address), network.prefixlen))
          merged = list(ipaddress.collapse_addresses(lite | full))
          merged.sort(key=lambda network: (int(network.network_address), network.prefixlen))
          if not only or not merged:
              raise RuntimeError("No IPv4 networks were generated")

          only_output = "\n".join(str(network) for network in only) + "\n"
          merged_output = "\n".join(str(network) for network in merged) + "\n"
          Path("cn-ipv4-only.list").write_text(only_output, encoding="utf-8", newline="\n")
          Path("cn-ipv4-merged.list").write_text(merged_output, encoding="utf-8", newline="\n")
          print(f"Generated {len(only)} source IPv4 rules")
          print(f"Generated {len(merged)} aggregated merged IPv4 rules")
          PY

      - name: Download ad rule sources
        shell: bash
        run: |
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.mrs" \
            -o awavenue.mrs
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockmihomolite.mrs" \
            -o 217heidai.mrs

      - name: Download latest Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          MIHOMO_URL=$(
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" |
            jq -r '.assets[].browser_download_url' |
            grep -E '/mihomo-linux-amd64-compatible-v[^/]+\.gz$' |
            head -n 1
          )

          test -n "${MIHOMO_URL}"
          curl -fsSL --retry 3 "${MIHOMO_URL}" -o mihomo.gz
          gzip -dc mihomo.gz > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: Build CN IPv4 MRS rule sets
        shell: bash
        run: |
          ./mihomo convert-ruleset ipcidr text \
            cn-ipv4-only.list cn-ipv4-only.mrs
          ./mihomo convert-ruleset ipcidr text \
            cn-ipv4-merged.list cn-ipv4-merged.mrs

          test -s cn-ipv4-only.mrs
          test -s cn-ipv4-merged.mrs
          if grep -q ':' cn-ipv4-only.list cn-ipv4-merged.list; then
            echo "IPv6 removal failed"
            exit 1
          fi

      - name: Merge and deduplicate ad rules
        shell: bash
        run: |
          ./mihomo convert-ruleset domain mrs awavenue.mrs awavenue.txt
          ./mihomo convert-ruleset domain mrs 217heidai.mrs 217heidai.txt

          awk 'NF && !seen[$0]++ { print }' \
            awavenue.txt 217heidai.txt > merged-pass1.txt

          ./mihomo convert-ruleset domain text \
            merged-pass1.txt merged-pass1.mrs
          ./mihomo convert-ruleset domain mrs \
            merged-pass1.mrs merged-canonical.txt
          ./mihomo convert-ruleset domain text \
            merged-canonical.txt merged-ads.mrs

      - name: Validate outputs
        shell: bash
        run: |
          test -s merged-ads.mrs
          ./mihomo convert-ruleset domain mrs \
            merged-ads.mrs merged-verify.txt
          cmp -s merged-canonical.txt merged-verify.txt
          echo "Merged ad rules: $(wc -l < merged-verify.txt)"

      - name: Commit updated rules
        shell: bash
        run: |
          git add cn-ipv4-only.list cn-ipv4-only.mrs \
            cn-ipv4-merged.list cn-ipv4-merged.mrs \
            merged-ads.mrs

          if git diff --cached --quiet; then
            echo "No rule changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update all rules"
          git push origin HEAD:main
